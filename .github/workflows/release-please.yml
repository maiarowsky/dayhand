# Opens and updates the release PR for dayhand (cli/) from Conventional Commits;
# merging it tags dayhand-vX.Y.Z and writes cli/CHANGELOG.md. The backend and the
# apps are not part of it: the CLI has its own version. Does nothing until the
# repository variable DAYHAND_RELEASE_ENABLED is "true" (docs/release.md).
name: Release dayhand

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    if: vars.DAYHAND_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # With a token that may start workflows, the new tag starts publish-npm.yml;
          # with the default token, run that workflow by hand on the tag.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
