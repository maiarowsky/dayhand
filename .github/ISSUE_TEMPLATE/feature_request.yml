name: Feature request
description: Suggest a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would help. For the CLI, the command line you would like to type and its output.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dayhand CLI
        - MCP endpoint
        - Backend
        - Android app
        - iOS app
        - Documentation
