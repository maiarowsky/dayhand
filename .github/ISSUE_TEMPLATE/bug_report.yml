name: Bug report
description: Something in Helm (app, backend, MCP or the hlm CLI) does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private reporting instead (see SECURITY.md), never here.
        Do not paste API keys, pairing codes or deployment URLs you want to keep private.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - hlm CLI
        - MCP endpoint
        - Backend
        - Android app
        - iOS app
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or steps, what you expected and what you got instead.
      placeholder: |
        hlm add Call the bank --due "fri 2pm"
        Expected: due on Friday at 14:00. Got: exit 2 "Not a date".
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: For the CLI, the output with --json (errors are one JSON line on stderr) and the exit code (echo $?).
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "hlm version --json (CLI and server), or the app version; and the operating system."
      placeholder: "hlm 0.3.0, server 0.3.0, macOS 26"
    validations:
      required: true
