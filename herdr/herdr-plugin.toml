id = "dayhand"
name = "Dayhand"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Give an agent pane a Dayhand task, keep the task in step with the agent, open dayhand ui"
platforms = ["linux", "macos"]

[[actions]]
id = "assign"
title = "Dayhand: give this agent a task"
contexts = ["pane"]
command = ["/bin/sh", "dayhand-herdr.sh", "assign"]

[[actions]]
id = "today"
title = "Dayhand: open Today"
contexts = ["pane", "workspace"]
command = ["/bin/sh", "dayhand-herdr.sh", "today"]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "dayhand-herdr.sh", "event"]

[[events]]
on = "pane.closed"
command = ["/bin/sh", "dayhand-herdr.sh", "event"]

[[panes]]
id = "picker"
title = "Dayhand task"
placement = "popup"
width = "80%"
height = "70%"
command = ["/bin/sh", "dayhand-herdr.sh", "pick"]

[[panes]]
id = "ui"
title = "Dayhand"
placement = "overlay"
command = ["/bin/sh", "dayhand-herdr.sh", "ui"]
